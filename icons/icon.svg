<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square: iOS and Android apply their own rounded mask. Keep artwork inside the central 80% for maskable icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1746c"/>
      <stop offset="1" stop-color="#5f9fe3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="300" text-anchor="middle" fill="#fff" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-4">QQLL</text>
</svg>
